      <script>
       const reverseString = (str) => {
    let reversed = '';
    for (let i = str.length - 1; i >= 0; i--) {
        reversed += str[i];
    }
    return reversed;
};


const inputString =prompt("Enter a string");
const reversedString = reverseString(inputString);
alert(reversedString);

      </script>

</html>
